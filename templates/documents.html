<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Document Library</title>
</head>
<body>
    <h2>Document Library</h2>
    <ul>
        {% for document in documents %}
            <li>{{ document[1] }} - <a href="/download/{{ document[0] }}">Download</a></li>
        {% endfor %}
    </ul>
</body>
</html>
