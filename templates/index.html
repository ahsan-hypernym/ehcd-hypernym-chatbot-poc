<!DOCTYPE html>
<html lang="en">
<head>
    <!-- Meta Tags -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Chat</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- jQuery CDN -->
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" integrity="sha384-uO3SX0wZq5iLE6fGXVlbN6V6yfOyvVfiH6r39G9fCQ6DUB1vpMsiudli9K/8k5ga" crossorigin="anonymous">
    <!-- Plotly.js for charts -->
    <script src="https://cdn.plot.ly/plotly-2.27.0.min.js"></script>

    <!-- Custom Styles -->
    <style>
        .chat-widget {
            height: 100vh;
            max-height: 800px;
        }
        #initial-text {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            color: #888;
            font-size: 1.25rem;
            padding: 0 20px;
        }
        #chat-box {
            position: relative;
        }
        .chart-container {
            width: 100%;
            max-width: 600px;
            height: 380px;
            margin: 8px 0;
            border-radius: 8px;
            background: #fff;
        }
    </style>
</head>
<body class="bg-gray-100 flex items-center justify-center min-h-screen m-0">
    <div class="chat-widget w-full max-w-2xl flex flex-col bg-gray-100">
        <!-- Header -->
        <div class="bg-gray-100 text-gray-800 p-3 flex flex-col sm:flex-row items-center justify-between">
            <img src="static/hy.png" alt="Your Logo" class="h-12 sm:h-18">
            <!-- NEW: User ID box -->
            <div class="flex items-center gap-2 mt-3 sm:mt-0">
                <label for="userIdInput" class="text-sm text-gray-700">User&nbsp;ID</label>
                <input id="userIdInput" type="number" min="1"
                    class="w-28 px-3 py-2 text-sm rounded-md border border-gray-300 focus:outline-none focus:ring-2 focus:ring-gray-400 bg-white"
                    placeholder="e.g. 151" />
                <button id="saveUserIdBtn"
                        class="px-3 py-2 text-sm text-white bg-gray-700 rounded-md hover:bg-gray-600">
                Save
                </button>
            </div>
            <div class="flex space-x-4 mt-3 sm:mt-0">
                <a href="{{ url_for('list_documents') }}" target="_blank" class="px-3 py-2 text-sm text-white bg-gray-600 rounded-full cursor-pointer transition duration-300 ease-in-out hover:bg-gray-500 shadow-md">Document Library</a>
                <form action="{{ url_for('logout') }}" method="get">
                    <button type="submit" class="px-5 py-2 text-white bg-red-500 rounded-full cursor-pointer transition duration-300 ease-in-out hover:bg-red-400 shadow-lg">Logout</button>
                </form>
            </div>
        </div>

        <!-- Chat Box -->
        <div id="chat-box" class="flex-1 p-4 overflow-y-auto bg-gray-100 flex flex-col">
            <!-- Initial Text -->
            <div id="initial-text"><strong>Welcome to AI Chat!</strong><br>
                <strong>Start your conversation now.</strong></div>
            <!-- Messages will be dynamically added here -->
        </div>

        <!-- Input Section -->
        <div class="flex items-center bg-gray-100 p-3">
            <textarea id="queryInput" placeholder="Type your query here." rows="1" style="line-height: 1.5;" class="flex-grow bg-white text-gray-800 border-none rounded-lg py-3 px-4 text-base outline-none cursor-text mb-3 overflow-hidden resize-none"></textarea>
            <button onclick="sendMessage()" class="bg-gray-700 text-white border-none rounded-full p-4 ml-2 flex items-center justify-center cursor-pointer transition duration-200 ease-in-out hover:bg-gray-600 mb-3">
                <!-- SVG Icon -->
                <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor">
                    <path fill-rule="evenodd" d="M3.293 12.707a1 1 0 011.414 0L10 7.414l5.293 5.293a1 1 0 111.414-1.414l-6-6a1 1 0 00-1.414 0l-6 6a1 1 0 010 1.414z" clip-rule="evenodd" />
                </svg>
            </button>
        </div>
    </div>

    <!-- JavaScript -->
    <script>
        // --- User ID helpers ---
    function getStoredUserId() {
        return localStorage.getItem('rbac_user_id') || '';
    }

    function setStoredUserId(val) {
        if (val && /^\d+$/.test(val)) {
        localStorage.setItem('rbac_user_id', String(parseInt(val, 10)));
        return true;
        }
        return false;
    }

    function ensureUserIdOrToast() {
        const uid = getStoredUserId();
        if (!uid) {
        alert('Please enter and Save a numeric User ID first.');
        document.getElementById('userIdInput').focus();
        return null;
        }
        return uid;
    }

    // On load: hydrate input from localStorage
    document.addEventListener('DOMContentLoaded', function () {
        const input = document.getElementById('userIdInput');
        const btn   = document.getElementById('saveUserIdBtn');

        if (input && btn) {
        input.value = getStoredUserId();

        btn.addEventListener('click', () => {
            const ok = setStoredUserId(input.value.trim());
            if (ok) {
            // quick visual feedback
            btn.textContent = 'Saved';
            setTimeout(() => (btn.textContent = 'Save'), 1200);
            } else {
            alert('Enter a valid numeric User ID (e.g., 151) and try again.');
            input.focus();
            }
        });
        }
        const queryInput = document.getElementById('queryInput');
            queryInput.addEventListener('keydown', function (event) {
            if (event.key === 'Enter' && !event.shiftKey) {
                event.preventDefault();
                sendMessage();
            }
            });

            // Auto-resize textarea
        const textarea = document.getElementById('queryInput');
            textarea.addEventListener('input', () => {
            textarea.style.height = 'auto';
            const maxHeight = parseInt(getComputedStyle(textarea).lineHeight) * 5;
            textarea.style.height = `${Math.min(textarea.scrollHeight, maxHeight)}px`;
            });
        });
        async function sendMessage() {
            const query = $('#queryInput').val();
            if (query.trim() === '') return;

            const userId = ensureUserIdOrToast();
            if (!userId) return; // stop if no user id


             // Remove the initial text if it exists
             $('#initial-text').remove();

            // Append user message
            $('#chat-box').append(`
                <div class="bg-gray-300 text-gray-800 p-2 rounded-lg max-w-[100%] ml-auto mb-2 break-words">
                    ${query}
                </div>
                `);

            $('#queryInput').val('');
            $('#chat-box').scrollTop($('#chat-box')[0].scrollHeight);

            // Show typing indicator
            const typingElement = $('<div class="bg-gray-200 text-gray-800 p-2 rounded-lg max-w-[80%] self-start mb-2 text-left">Typing...</div>');
            $('#chat-box').append(typingElement);

            try {
                const response = await fetch('/api/query', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                            query: query,
                            user_id: parseInt(userId, 10)  
                        })
                });

                if (!response.ok) {
                    throw new Error('Network response was not ok');
                }

                const reader = response.body.getReader();
                const decoder = new TextDecoder();
                let result = '';
                let isFinalHtmlRendered = false;

                while (true) {
                    const { done, value } = await reader.read();
                    if (done) break;

                    const chunk = decoder.decode(value, { stream: true });
                    result += chunk;

                    const match = result.match(/<replace>([\s\S]*)<\/replace>/);
                    if (match && !isFinalHtmlRendered) {
                        const raw = match[1];
                        let finalHtml = raw;
                        let chartData = null;

                        // Check if it's JSON (has chart_data) or plain HTML
                        if (raw.trimStart().startsWith('{')) {
                            try {
                                const parsed = JSON.parse(raw);
                                finalHtml = parsed.html || raw;
                                chartData = parsed.chart_data || null;
                            } catch (e) {
                                finalHtml = raw;
                            }
                        }

                        const finalElement = $('<div class="bg-gray-200 text-gray-800 p-2 rounded-lg max-w-[80%] self-start mb-2 text-left break-words"></div>').html(finalHtml);
                        typingElement.replaceWith(finalElement);
                        isFinalHtmlRendered = true;

                        // Render Plotly chart if present
                        if (chartData && chartData.plotly_data && chartData.plotly_layout) {
                            const chartId = 'chart_' + Date.now() + '_' + Math.random().toString(36).substr(2, 6);
                            const chartDiv = $('<div id="' + chartId + '" class="chart-container"></div>');
                            finalElement.after(chartDiv);
                            try {
                                Plotly.newPlot(chartId, chartData.plotly_data, chartData.plotly_layout, {responsive: true});
                            } catch (e) {
                                console.error('Chart render error:', e);
                            }
                        }
                    } else if (!isFinalHtmlRendered) {
                        typingElement.text(result.replace(/<\/?[^>]+(>|$)/g, ""));
                    }

                    $('#chat-box').scrollTop($('#chat-box')[0].scrollHeight);
                }

                if (!isFinalHtmlRendered) {
                    typingElement.remove();
                }
            } catch (error) {
                console.error('Error processing the request:', error);
                typingElement.text('Error processing your request.');
                $('#chat-box').scrollTop($('#chat-box')[0].scrollHeight);
            }
        }


    </script>
</body>
</html>
